# One command starts everything:   docker compose up --build
#   Web app  -> http://localhost:3000
#   API      -> http://localhost:8080
#   Database -> localhost:5433  (db: vms, user: vms)   [5433 so it never clashes with a local PostgreSQL on 5432]
services:
  db:
    image: postgres:18
    container_name: vms-db
    environment:
      POSTGRES_DB: vms
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vms123}
      TZ: Asia/Kolkata
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - vms-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: vms-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vms
      SPRING_DATASOURCE_USERNAME: vms
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vms123}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vms-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  vms-db-data:
